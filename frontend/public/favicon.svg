<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="favHorse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="50%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="favSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1e293b" stroke-width="1.5" />

  <!-- Speed Arc -->
  <path d="M 6 42 C 22 36, 42 36, 58 40" stroke="#0099ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 12 45 C 26 40, 40 40, 52 44" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- Leaping Horse Emblem Silhouette -->
  <g transform="translate(-2, 2) scale(0.08)">
    <!-- Mane & Head -->
    <path d="M 520 40 C 420 52, 330 95, 230 195 C 285 130, 400 88, 530 46 Z" fill="url(#favSilver)" />
    <!-- Horse Face & Ears -->
    <path d="M 648 60 C 655 48, 668 40, 678 42 C 675 55, 665 68, 655 78 Z" fill="url(#favSilver)" />
    <path d="M 632 78 C 675 98, 715 142, 715 178 C 685 190, 652 148, 615 172 C 540 160, 600 135, 632 78 Z" fill="url(#favSilver)" />
    <circle cx="682" cy="138" r="7" fill="#0f172a" />
    <circle cx="684" cy="136" r="2.5" fill="#ffffff" />
    
    <!-- Chest & Front legs -->
    <path d="M 520 140 C 600 200, 625 240, 540 190 Z" fill="url(#favSilver)" />
    <path d="M 570 235 C 645 285, 755 355, 735 355 C 670 295, 595 245, 570 235 Z" fill="url(#favSilver)" />
    <path d="M 525 245 C 580 295, 595 330, 565 335 C 535 285, 505 265, 525 245 Z" fill="#0077e6" />

    <!-- Center Tech Torso with Cyan Gradient -->
    <path d="M 235 230 C 310 160, 420 125, 525 145 C 465 210, 365 272, 245 275 Z" fill="url(#favHorse)" />
    
    <!-- Hind Leg -->
    <path d="M 245 275 C 170 300, 65 335, 115 305 C 205 265, 245 252, 245 275 Z" fill="#0066cc" />
    
    <!-- Digital Circuit Traces -->
    <path d="M 280 165 L 385 165 L 405 180 L 450 180" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <circle cx="452" cy="180" r="10" fill="#ffffff" />
    <path d="M 260 190 L 330 190 L 350 205 L 485 205" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <circle cx="488" cy="205" r="11" fill="#ffffff" />
    <path d="M 245 215 L 305 215 L 325 230 L 440 230" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <circle cx="442" cy="230" r="10" fill="#ffffff" />
  </g>

  <!-- "IT" Monogram Text at bottom -->
  <text x="32" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#38bdf8" letter-spacing="1px">IT SAATHI</text>
</svg>
